<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTENFOX • Ecossistema Multi-Nicho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
       
        :root { --primary: #00d4ff; }
       
        body { font-family: 'Inter', sans-serif; }
        .heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-zinc-950/80 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#00d4ff] rounded-2xl flex items-center justify-center text-black font-bold text-3xl">🦊</div>
                <span class="heading text-3xl font-semibold tracking-tighter">SISTENFOX</span>
            </div>
            <div class="hidden md:flex items-center gap-10 text-sm font-medium">
                <a href="#nichos" class="hover:text-[#00d4ff]">Nichos</a>
                <a href="#beneficios" class="hover:text-[#00d4ff]">Benefícios</a>
                <a href="#planos" class="hover:text-[#00d4ff]">Planos</a>
            </div>
            <a href="#planos" class="px-8 py-3.5 bg-[#00d4ff] text-black rounded-2xl font-semibold hover:bg-cyan-300 transition-all">
                Testar Grátis
            </a>
        </div>
    </nav>

    <!-- HERO - Novo design conforme imagem -->
    <section class="min-h-screen bg-zinc-950 flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
            
            <!-- Lado Esquerdo - Texto -->
            <div class="space-y-8">
                <div class="inline-flex items-center gap-2 px-5 py-2 bg-white/5 border border-white/10 rounded-full text-sm">
                    <div class="w-2 h-2 bg-[#00d4ff] rounded-full animate-pulse"></div>
                    <span>SaaS Premium Multi-Nicho</span>
                </div>
                
                <h1 class="heading text-6xl md:text-7xl font-bold leading-tight">
                    Gerencie seu negócio<br>em <span class="text-[#00d4ff]">qualquer nicho</span>
                </h1>
                
                <p class="text-xl text-zinc-400 max-w-lg">
                    O ecossistema inteligente para restaurantes, estética, clínicas, 
                    oficinas, varejo e construção civil.
                </p>
                
                <div class="flex flex-wrap gap-4">
                    <a href="https://sistenfox.store" target="_blank"
                       class="px-8 py-4 bg-[#00d4ff] hover:bg-cyan-300 text-black font-semibold rounded-2xl text-lg flex items-center gap-3 transition-all">
                        Começar Teste Grátis
                        <span class="text-xl">→</span>
                    </a>
                    <a href="#planos" 
                       class="px-8 py-4 border border-white/30 hover:bg-white/5 rounded-2xl text-lg transition-all">
                        Ver Planos
                    </a>
                </div>
            </div>

            <!-- Lado Direito - Imagem Grande -->
            <div class="relative hidden md:block">
                <div class="absolute -inset-6 bg-[#00d4ff]/10 blur-3xl rounded-[3rem]"></div>
                <div class="relative rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                    <img src="https://picsum.photos/id/1015/900/620" 
                         alt="Paisagem - Gerencie seu negócio" 
                         class="w-full h-auto object-cover">
                </div>
            </div>
        </div>
    </section>

    <!-- Restante do conteúdo (Nichos, Benefícios, Carrossel, Planos, etc.) -->
    <!-- ... (mantido igual ao anterior) ... -->

</body>
</html>
