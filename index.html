    <!-- Script do Carrossel + Botão Flutuante -->
    <script>
        // Carrossel
        const slides = document.querySelectorAll(".carousel-slide");
        const dots = document.querySelectorAll(".dot");
        let index = 0;

        function showSlide(i) {
            slides.forEach((slide, idx) => slide.classList.toggle("hidden", idx !== i));
            dots.forEach((dot, idx) => {
                dot.classList.toggle("bg-white/70", idx === i);
                dot.classList.toggle("bg-white/30", idx !== i);
            });
        }

        document.getElementById("nextBtn").onclick = () => { index = (index + 1) % slides.length; showSlide(index); };
        document.getElementById("prevBtn").onclick = () => { index = (index - 1 + slides.length) % slides.length; showSlide(index); };

        setInterval(() => {
            index = (index + 1) % slides.length;
            showSlide(index);
        }, 5000);

        dots.forEach((dot, i) => dot.addEventListener("click", () => { index = i; showSlide(index); }));
        showSlide(index);
